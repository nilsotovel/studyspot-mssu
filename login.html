<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot MSSU - Log in</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-container">

        <div class="site-title">
            <h1>StudySpot MSSU</h1>
            <p>Campus study spot reviews</p>
        </div>

        <div class="form-box">
            <h2>Log in</h2>

            <div id="error-box" class="error-box"></div>

            <form id="login-form" action="login.php" method="post">

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="your_username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••">

                <button type="submit">Log in</button>
            </form>
        </div>

        <p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
